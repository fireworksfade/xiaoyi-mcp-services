[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaoyi-mcp-services"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.1.1",
  "paho-mqtt==2.1.0",
  "PyMySQL==1.2.0",
  "pypdf==6.17.0",
  "pydantic==2.12.5",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.5"]

[tool.hatch.build.targets.wheel]
packages = ["common", "iot_diagnosis", "iot_control", "model_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
